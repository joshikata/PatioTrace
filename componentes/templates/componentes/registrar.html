{% extends "componentes/base.html" %}

{% block titulo %}Registrar componente · PatioTrace{% endblock %}

{% block contenido %}

<a href="{% url 'inicio' %}" class="volver">
    <svg class="icono" aria-hidden="true"><use href="#i-atras"/></svg>
    Volver al inventario
</a>

<div class="page-head">
    <div>
        <h1>Registrar componente</h1>
        <p class="subtitulo">Ingresa la información disponible.</p>
    </div>
</div>

<div class="card form-card">
    <form method="post">
        {% csrf_token %}

        {% include "componentes/_campos.html" %}

        <button type="submit" class="btn btn-grande">
            <svg class="icono" aria-hidden="true"><use href="#i-check"/></svg>
            Guardar componente
        </button>
    </form>
</div>

{% endblock %}
