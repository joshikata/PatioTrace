{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}PatioTrace{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'componentes/patiotrace.css' %}">
</head>

<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></symbol>
            <symbol id="i-caja" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol>
            <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></symbol>
            <symbol id="i-mov" viewBox="0 0 24 24"><path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"/></symbol>
            <symbol id="i-buscar" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
            <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
            <symbol id="i-atras" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
            <symbol id="i-flecha" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
            <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
            <symbol id="i-qr" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM20 14v7h-3"/></symbol>
            <symbol id="i-reloj" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
            <symbol id="i-usuario" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
            <symbol id="i-salir" viewBox="0 0 24 24"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></symbol>
        </defs>
    </svg>

    <header class="topbar">
        <div class="topbar-inner">
            <a class="marca" href="{% url 'inicio' %}">
                <svg class="icono" aria-hidden="true"><use href="#i-logo"/></svg>
                <span>Patio<em>Trace</em></span>
            </a>

            <nav class="nav" aria-label="Principal">
                <a href="{% url 'inicio' %}">
                    <svg class="icono" aria-hidden="true"><use href="#i-caja"/></svg>
                    Inventario
                </a>
                {% if user.is_authenticated %}
                    <span class="usuario">
                        <svg class="icono" aria-hidden="true"><use href="#i-usuario"/></svg>
                        {{ user.get_username }}
                    </span>
                    <form method="post" action="{% url 'admin:logout' %}">
                        {% csrf_token %}
                        <button type="submit">
                            <svg class="icono" aria-hidden="true"><use href="#i-salir"/></svg>
                            Salir
                        </button>
                    </form>
                {% endif %}
            </nav>
        </div>
    </header>

    <main>
        {% if messages %}
            {% for message in messages %}
                <div class="mensaje{% if message.tags == 'error' %} error{% endif %}" role="status">
                    <svg class="icono" aria-hidden="true"><use href="#i-check"/></svg>
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block contenido %}
        {% endblock %}
    </main>
</body>
</html>
