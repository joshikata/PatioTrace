{% if formulario.non_field_errors %}
    <div class="mensaje error" role="alert">{{ formulario.non_field_errors|join:" " }}</div>
{% endif %}

{% for campo in formulario %}
    <div class="campo">
        {{ campo.label_tag }}
        {{ campo }}
        {% if campo.help_text %}<p class="ayuda">{{ campo.help_text }}</p>{% endif %}
        {{ campo.errors }}
    </div>
{% endfor %}
